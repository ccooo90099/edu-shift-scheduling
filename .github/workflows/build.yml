name: 测试并构建两端

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # 快速门禁：Linux 上跑一遍全量测试，不过就不进构建。
  test:
    name: 测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 跑测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  build:
    name: 构建 ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            label: macos-arm64
          - os: macos-15-intel  # Intel（macos-13 已退役，会永远排队）
            label: macos-x64
          - os: windows-latest
            label: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 在目标平台上再跑一遍——Linux 过了不代表 mac/Windows 过
      - name: 跑测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      # 只有公钥参与构建。私钥永远不进 CI。
      - name: 写入公钥
        id: pubkey
        shell: bash
        env:
          LICENSE_PUBLIC_KEY_B64: ${{ secrets.LICENSE_PUBLIC_KEY_B64 }}
        run: |
          # 优先级：Secret（用于轮换） > 源码里钉死的公钥 > 占位符（开发版）
          if [ -n "$LICENSE_PUBLIC_KEY_B64" ]; then
            python tools/embed_pubkey.py --key "$LICENSE_PUBLIC_KEY_B64"
            echo "embedded=true" >> "$GITHUB_OUTPUT"
          elif python tools/embed_pubkey.py --verify; then
            echo "::notice::使用源码中钉死的公钥"
            echo "embedded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::源码里还是占位符，且没配 Secret —— 产出的用户端无法通过授权校验"
            python tools/embed_pubkey.py --allow-missing
            echo "embedded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包用户端
        run: pyinstaller --noconfirm --clean packaging/user.spec

      - name: 打包管理端
        run: pyinstaller --noconfirm --clean packaging/admin.spec

      # macOS 必须用 ditto 打包 .app，zip 会丢符号链接和权限位
      - name: 压缩产物 (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent EduShift.app      EduShift-${{ matrix.label }}.zip
          ditto -c -k --keepParent EduShiftAdmin.app EduShiftAdmin-${{ matrix.label }}.zip

      - name: 压缩产物 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/EduShift      -DestinationPath dist/EduShift-${{ matrix.label }}.zip
          Compress-Archive -Path dist/EduShiftAdmin -DestinationPath dist/EduShiftAdmin-${{ matrix.label }}.zip

      # --selftest 不开窗口，只验证依赖全冻进去了、公钥嵌进去了、引擎能算
      - name: 冒烟：跑产物自检
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            USER_BIN="dist/EduShift.app/Contents/MacOS/EduShift"
            ADMIN_BIN="dist/EduShiftAdmin.app/Contents/MacOS/EduShiftAdmin"
          else
            USER_BIN="dist/EduShift/EduShift.exe"
            ADMIN_BIN="dist/EduShiftAdmin/EduShiftAdmin.exe"
          fi
          "$ADMIN_BIN" --selftest
          if [ "${{ steps.pubkey.outputs.embedded }}" = "true" ]; then
            "$USER_BIN" --selftest
          else
            # 没配 Secret 时用户端必然报"未嵌入公钥"，这里只要求它别崩
            "$USER_BIN" --selftest || echo "::warning::用户端自检未通过（未嵌入公钥）"
          fi

      - name: 上传用户端
        uses: actions/upload-artifact@v4
        with:
          name: EduShift-${{ matrix.label }}
          path: dist/EduShift-${{ matrix.label }}.zip
          if-no-files-found: error

      - name: 上传管理端
        uses: actions/upload-artifact@v4
        with:
          name: EduShiftAdmin-${{ matrix.label }}
          path: dist/EduShiftAdmin-${{ matrix.label }}.zip
          if-no-files-found: error

  # 打 v* 标签时，把六个产物挂到 Release 上。不打标签不会触发。
  release:
    name: 发布
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            两端各三个平台。**管理端只发给管理员，不要随产品分发。**

            | 平台 | 用户端 | 管理端 |
            |---|---|---|
            | macOS Apple Silicon | EduShift-macos-arm64.zip | EduShiftAdmin-macos-arm64.zip |
            | macOS Intel | EduShift-macos-x64.zip | EduShiftAdmin-macos-x64.zip |
            | Windows x64 | EduShift-windows-x64.zip | EduShiftAdmin-windows-x64.zip |

            产物未做代码签名：macOS 首次打开需右键「打开」，Windows 会有 SmartScreen 提示。
