# 排班规则配置
# ─────────────────────────────────────────────────────────────
# 这个文件是工具的"后台配置"。改规则只改这里，不动代码。
# 复制成 config/rules.yaml 后修改（rules.yaml 已在 .gitignore 里）。

版本: 1

# ── 时段定义 ────────────────────────────────────────────────
# 顺序即先后。工具用真实钟点算"连堂"和"赶路时间"，不是按格子数。
时段:
  - "08:10-10:10"
  - "10:30-12:30"
  - "13:30-15:30"
  - "14:00-16:00"
  - "16:20-18:20"
  - "18:30-20:30"

# ── Q1 · 什么算"同一撮学生" ─────────────────────────────────
# 规则：同一个时段内，下面这些字段全部相同的团队，不允许出现两个不同的产品。
# 想收紧就减字段，想放宽就加字段。字段名直接取明细表的列名。
冲突口径:
  分组字段: [校区, 程度]

  # 可加的字段，按放宽程度排列（源表实测违反率见 docs/需求理解.md）：
  #   校区      合并"XX科学/XX文学"后的校区；换成"中心"则不合并  → 40% / 37%
  #   团队类型  能力层级 LI/LE/BO/CX/ZY，加上它判定放宽          → 9%
  #   班序      平行班序号 LI1/LI2，再加上它判定最宽             → 5%

# 程度 = 年级。当前项目取值 S7/S8/S9，一个学生只属于一个程度，
# 跨产品不会变——所以它才能当"同一撮学生"的判定字段。
# 将来年级口径变了（比如拆到 S7上/S7下），改这里即可。
程度:
  字段: 程度
  取值: [S7, S8, S9]

# 校区 = 中心去掉学科后缀。百花科学 + 百花文学 = 百花（同一个校区两栋楼）。
校区:
  由中心推导: true
  合并后缀: [科学, 文学]
  不合并: []          # 例外：写在这里的中心名原样保留，不并入校区

# ── Q2 · 哪些课必须挨着 ─────────────────────────────────────
# "挨着" = 在同一撮学生里，两个产品占用前后相接的时段（中间不空）。
连堂:
  分组范围: [校区, 程度, 团队类型]   # 对哪一撮学生要求相邻
  规则:
    - 名称: 编程双语连堂
      产品: [编程理论, 双语文化]
      强度: 硬              # 硬 = 排不下就报不可行；软 = 尽量，没做到扣分
      顺序: 不限            # 不限 | 按列表（按列表 = 必须 编程→双语）
      允许中间隔: 0         # 中间最多允许夹几节别的课
      最大间隙_分钟: 自动   # 两节之间最多让学生等多久。见下方说明

    - 名称: 文学美育跟随
      产品: [双语文化, 文学美育]
      强度: 软
      顺序: 不限
      允许中间隔: 0
      最大间隙_分钟: 自动

# 关于「最大间隙_分钟」—— 两节课之间最多让学生等多久，还算"挨着"。
#
# 填「自动」：从上面的时段表推算。做法是把所有相接组合的间隔排序，
# 找最大的一次跳变，跳变以下算课间、以上算真正的休息。
# 按当前时段表推出来是 20 分钟：
#     10 / 20 分钟 → 课间，算"挨着"
#     50 / 60 / 90 分钟 → 休息，不算
#
# 这条线画在这里，是因为教培不是托管：午休家长要把孩子接走，
# 跨午休的两节课等于家长跑两趟，不能叫"挨着"。
#
# 时段表以后改了，「自动」会跟着重算，不用记得回来改死数。
# 也可以直接填数字覆盖，比如 30、120。

# ── Q3 · 地理上的"近" ───────────────────────────────────────
# 近 = 地图上的近。数据来源按可信度排队，前面有就不用后面的：
#   ① config/travel.csv   真实驾车时间/里程（tools/travel_matrix.py 跑出来的）
#   ② 经纬度直线估算       直线 km × 折算系数 ÷ 车速 + 固定开销
#   ③ 同校区/同区域/跨区域  连坐标都没有时的兜底
#
# 准备数据（各跑一次，之后排班完全离线、不需要网络和 key）：
#   python tools/geocode_centers.py --key <高德Key>    # 地址 → 经纬度
#   python tools/travel_matrix.py   --key <高德Key>    # 两两驾车时间/里程
地理:
  中心坐标表: config/centers.csv
  通行时间表: config/travel.csv

  # 判定一次跨中心转场能不能接受，用哪个口径 —— 时间 或 距离，二选一
  判定方式: 时间

  时间:
    # 赶路时间 ≥ 通行时间 + 安全余量 才算可接受
    安全余量_分钟: 10

  距离:
    # 判定方式改成「距离」时用这个：路程超过上限就算不可接受
    上限_km: 8

  # 没有真实数据时怎么估
  估算:
    直线折算系数: 1.4         # 直线 km × 系数 ≈ 实际路程
    平均车速_kmh: 22          # 深圳市区含红灯
    固定开销_分钟: 15         # 下课收尾、找车、进出场

  # 判定不通过算硬约束还是软约束。软 = 扣分；硬 = 直接判不可行
  违规级别: 软

# ── 单人限制 ────────────────────────────────────────────────
指导员:
  单日最多节数: 4
  单日最多中心数: 2
  资质字段: 产品              # 老师能教哪些产品（106 人中 103 人只教 1 个）

# ── 罚分权重 ────────────────────────────────────────────────
# 体检和排班用同一套权重，所以"排得好不好"是同一把尺子。
#
# 关键不是单个数字，是它们的比例。一条硬连堂没满足 = 连堂不相邻 × 硬约束倍数
# = 3000 分，跨一个中心 = 800 分，比例约 3.75:1 —— 为了救一条硬连堂可以
# 调动一个老师，但不会为此满城调人。
#
# 反例：早期这里写的是 12000 : 20（600:1），求解器算出 31 次跨中心转场。
# 段次3 只有 4 个时段、间隔 20/90/20 分钟，只有中午那档来得及跨中心，
# 31 次等于 56% 的老师每个上课日中午横穿城市。手工排班是 8 次。
权重:
  未排上团队: 100000        # 排不下是最严重的，压倒一切
  连堂不相邻: 60
  硬约束倍数: 50            # 强度标「硬」的连堂规则，罚分放大这么多倍
  转场时间不够: 400
  跨中心一次: 800           # 老师当天多跑一个中心的代价
  每公里转场: 6
  课表空档一段: 8
  工作量峰值: 30            # 压住最重的那个人
