# 排班规则。复制成 config/rules.yaml 后按实际情况改（真实文件不入库）。
#
# 每条规则的业务出处见 docs/业务理解.md，完整推导见 docs/业务需求.md。

# ── 场景与时段 ────────────────────────────────────────────────
#
# 期位是两个场景共用的同一个维度：
#     期位 A = 寒暑假第一期 = 春秋季周六
#     期位 B = 寒暑假第二期 = 春秋季周日
# 暑假第一期的课平移到春秋季周六，第二期平移到周日 —— 所以不需要
# 「期」和「星期」两个维度，一个期位就够。
#
# 时段表按期位分别给。春秋季周五只开晚上一档，就靠这里表达，
# 不在代码里写死星期。
时段:
  A: ["08:10-10:10", "10:30-12:30", "14:00-16:00", "16:20-18:20", "18:30-20:30"]
  B: ["08:10-10:10", "10:30-12:30", "14:00-16:00", "16:20-18:20", "18:30-20:30"]
#
# 原表出现过的 13:30-15:30 与 14:00-16:00 重叠，用户定案暂不考虑。
# 但**重叠判定的代码逻辑保留** —— 时段表可配置，将来加回来时
# 不能再踩一次「只判单向漏掉一半」的坑。

# ── 黄金时段与促销班 ──────────────────────────────────────────
#
# 只看一天当中的时间，不看星期几，两个场景同一套定义。
黄金时段: ["08:10-10:10", "10:30-12:30"]

促销班:
  # false = 促销班的候选时段里**直接删掉**黄金档（条件性硬排除，
  #         不是可被其他目标抵消的软罚分）。
  # true  = 只是不做这道过滤，**不是**反过来奖励促销班去占黄金档。
  #
  # 注意过滤要与当天营业时段取交集：春秋季周五本来就只开 18:30 一档，
  # 那天无论开关如何都只有这一档。
  允许占黄金时段: false

# ── 场地容量 ──────────────────────────────────────────────────
#
# 同一时刻最多能开几个班。**两层，都可选，同时生效时取更严的。**
# 粒度不固定，所以两层都做成配置。
#
#   ① 中心级：教室数。在网页「中心」页填，或由历史并发峰值估算
#             （估算出来的会标「估计」，人填的实数会覆盖它）
#   ② 校区级：整个校区同时最多开几个班。有时真正卡住的不是某栋楼的
#             教室数，而是校区能同时开的班数（共用前台、可调度师资…）
#
# 留空 = 不设那一层。**没配校区上限时只按各中心的教室数限制，
# 不会凭空造一个限制出来。**
# 也可以在网页「场地容量」页配，那边改的存在 data/campus_caps.json。
场地:
  校区并发上限:
    # 百花: 5        # 百花科学 + 百花文学 加起来同时最多 5 个班
    # 石厦: 6

# ── 地理 ──────────────────────────────────────────────────────
地理:
  中心坐标表: config/centers.csv
  通行时间表: config/travel.csv     # tools/travel_matrix.py 跑一次生成
  安全余量_分钟: 10                 # 赶路时间 ≥ 通行时间 + 余量
  估算:
    直线折算系数: 1.4
    平均车速_kmh: 22
    固定开销_分钟: 15

  # 哪些区算「相邻」。跨中心不是「同区/跨区」两档 ——
  # 同区内换最好，相邻区之间也还能换，不相邻的才是最差。
  # 只写一边就行，系统自动补成双向。
  # 也可以在网页「区域相邻」页配，那边改的存在 data/region_adjacency.json。
  相邻区域:
    宝安南山区: [福田区]
    福田区: [罗湖龙岗区]
    龙华区: [福田区, 宝安南山区]
#
# 数据来源按可信度排队，报告里会标明每次转场用的是哪一档：
#   ① travel.csv 实测   ② 经纬度直线估算   ③ 档位兜底
#
# 档位兜底的四档（只在既没坐标也没实测表时用）：
#   同校区 15 分钟 · 同区域 40 · 相邻区域 55 · 跨区域 70
#
# 兜底保守：区域不明、或没配相邻表的，一律按**最差档**算。
# 缺数据不该反而放宽约束。

# ── 权重 ──────────────────────────────────────────────────────
#
# 配置里的同名键**覆盖**代码默认值，未提供的键保留默认。
# 写了不认识的键会直接报错启动不了 —— 这是有意的：曾经改键名没同步到
# 另一侧，一侧静默用了默认值；也曾经连续三轮调权重完全不生效，
# 因为配置文件里还写着旧值。求解时会打印实际生效的权重表。
权重:
  # 降级链，必须满足：排不上 >> 挪期位 > 期位不符 > 连堂未达标
  排不上团队: 100000
  挪到另一期位: 4000        # 「挪到另一个期位」不是失败，是正常的次优解
  期位与历史不符: 300       # 期位跟着学生走，但能换 —— 软约束不是硬的
  连堂未达标: 60

  年级科目未覆盖: 200       # 每期尽量覆盖所有年级所有科目

  转场一次: 800             # 按相邻课之间实际发生的中心变更计，A→B→A = 2 次
  每公里转场: 6

  课表空档一段: 8
  工作量峰值: 30

  # 原 H2 降级而来。同校区同程度的不同产品可以同时段开课 ——
  # 教室和时段根本不够平铺，而且不是所有学生都读全科。
  # 代价正比于**同时报了这两科的估计人数**，不是「存在并发」本身。
  并发每受影响学生: 12

  排在期位B: 20             # 周六（期位 A）更好排
  单边期位无班: 150         # 两个期位都要有班，家长才有得选、老生才换得了

  额外使用教室: 15          # distinct−1 口径，不是「换教室次数」

  与原排班不同: 0           # 修复模式下调高。注意：全局软罚分保证不了
                            # 小改动，真正管用的是显式锁定不可改的团队
