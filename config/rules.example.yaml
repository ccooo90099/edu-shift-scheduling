# 排班规则配置
# ─────────────────────────────────────────────────────────────
# 这个文件是工具的"后台配置"。改规则只改这里，不动代码。
# 复制成 config/rules.yaml 后修改（rules.yaml 已在 .gitignore 里）。

版本: 1

# ── 时段定义 ────────────────────────────────────────────────
# 顺序即先后。工具用真实钟点算"连堂"和"赶路时间"，不是按格子数。
时段:
  - "08:10-10:10"
  - "10:30-12:30"
  - "13:30-15:30"
  - "14:00-16:00"
  - "16:20-18:20"
  - "18:30-20:30"

# ── Q1 · 什么算"同一撮学生" ─────────────────────────────────
# 规则：同一个时段内，下面这些字段全部相同的团队，不允许出现两个不同的产品。
# 想收紧就减字段，想放宽就加字段。字段名直接取明细表的列名。
冲突口径:
  分组字段: [校区, 程度]

  # 可加的字段，按放宽程度排列（源表实测违反率见 docs/需求理解.md）：
  #   校区      合并"XX科学/XX文学"后的校区；换成"中心"则不合并  → 40% / 37%
  #   团队类型  能力层级 LI/LE/BO/CX/ZY，加上它判定放宽          → 9%
  #   班序      平行班序号 LI1/LI2，再加上它判定最宽             → 5%

# 程度 = 年级。当前项目取值 S7/S8/S9，一个学生只属于一个程度，
# 跨产品不会变——所以它才能当"同一撮学生"的判定字段。
# 将来年级口径变了（比如拆到 S7上/S7下），改这里即可。
程度:
  字段: 程度
  取值: [S7, S8, S9]

# 校区 = 中心去掉学科后缀。百花科学 + 百花文学 = 百花（同一个校区两栋楼）。
校区:
  由中心推导: true
  合并后缀: [科学, 文学]
  不合并: []          # 例外：写在这里的中心名原样保留，不并入校区

# ── Q2 · 哪些课必须挨着 ─────────────────────────────────────
# "挨着" = 在同一撮学生里，两个产品占用前后相接的时段（中间不空）。
连堂:
  分组范围: [校区, 程度, 团队类型]   # 对哪一撮学生要求相邻
  规则:
    - 名称: 编程双语连堂
      产品: [编程理论, 双语文化]
      强度: 硬              # 硬 = 排不下就报不可行；软 = 尽量，没做到扣分
      顺序: 不限            # 不限 | 按列表（按列表 = 必须 编程→双语）
      允许中间隔: 0         # 中间最多允许夹几节别的课
      最大间隙_分钟: 30     # 两节之间最多让学生等多久。见下方说明

    - 名称: 文学美育跟随
      产品: [双语文化, 文学美育]
      强度: 软
      顺序: 不限
      允许中间隔: 0
      最大间隙_分钟: 30

# 关于「最大间隙_分钟」：本项目的时段之间空隙很不均匀——
#   08:10→10:30 空 20 分钟   10:30→14:00 空 90 分钟（午休）
#   14:00→16:20 空 20 分钟   16:20→18:30 空 10 分钟
# 填 30：只有 20 分钟那种首尾相接才算"挨着"，午休跨越不算。
# 填 120：午休跨越也算"挨着"。两种口径在现有排班上差 22 个百分点。

# ── Q3 · 地理上的"近" ───────────────────────────────────────
# 近 = 地图上的近。需要 config/centers.csv 提供每个中心的经纬度。
# 没有坐标表时工具自动退回"同校区 / 同区域 / 跨区域"三档粗判，并在报告里提示。
地理:
  中心坐标表: config/centers.csv
  距离算法: haversine         # haversine = 直线距离；driving = 走地图 API（需另配 key）
  直线折算系数: 1.4           # 直线 km × 系数 ≈ 实际路程
  平均车速_kmh: 22            # 深圳市区含红灯的平均速度
  固定开销_分钟: 15           # 下课收尾、找车、进出场

  # 有实测通行时间就填这张表，优先于上面的估算。格式：from,to,minutes
  实测通行分钟: config/travel_minutes.csv

  # 赶路时间不够时的处理：填数字 = 超过该分钟数直接判不可行；null = 只扣分
  转场硬上限_分钟: null

# ── 单人限制 ────────────────────────────────────────────────
指导员:
  单日最多节数: 4
  单日最多中心数: 2
  资质字段: 产品              # 老师能教哪些产品（106 人中 103 人只教 1 个）

# ── 罚分权重 ────────────────────────────────────────────────
# 体检和排班用同一套权重，所以"排得好不好"是同一把尺子。
权重:
  未排上团队: 100000
  连堂不相邻: 60
  转场时间不够: 400          # 赶路时间 < 实际需要的通行时间
  每公里转场: 2
  跨中心一次: 20
  课表空档一段: 8
  工作量方差: 3
